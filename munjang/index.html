<!DOCTYPE html>
<html lang="ko">
<head>

<style>
:root{--bg:#FAF9F7;--surface:#fff;--sub:#F3F1ED;--line:#E8E6E2;--text:#1A1A1A;--mut:#6B6B6B;--amber:#F59E0B;--amber-d:#B45309;--amber-l:#FCD68A;--err:#9F2D20}

.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}

h1{font-size:20px;font-weight:700;margin:0 16px 0 0;line-height:1.3}
.pill{font-size:13px;color:var(--mut);border:1px solid var(--line);border-radius:9999px;padding:2px 12px;margin-left:8px;background:var(--surface);font-variant-numeric:tabular-nums}

button.pill{cursor:pointer;font-family:inherit}
.sp{flex:1}

nav.tabs{background:var(--surface);border-bottom:1px solid var(--line)}

nav.tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--amber)}
.where{font-size:13px;color:var(--mut);margin:12px 0 0}
main{padding:16px 0 64px}
h2{font-size:18px;font-weight:700;margin:32px 0 8px;line-height:1.3}
h2:first-child{margin-top:8px}
h3{font-size:15px;font-weight:700;margin:24px 0 8px}
p{margin:0 0 8px}
.mut{color:var(--mut);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.note{background:var(--sub);border-radius:8px;padding:12px 16px;font-size:13px;line-height:1.8;color:var(--text);margin:8px 0 16px}

label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}

textarea{resize:vertical;line-height:1.6;min-height:44px;display:block}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--amber-d);outline-offset:1px}
button.btn{font:inherit;font-weight:600;border:1px solid #CFCBC4;background:var(--surface);color:var(--text);border-radius:8px;padding:6px 14px;cursor:pointer;white-space:nowrap}

button.btn.pri{background:var(--amber);border-color:var(--amber);color:#1A1A1A}
button.btn.sm{padding:3px 10px;font-size:13px}

@media (hover:hover){button.btn:hover{background:var(--sub)}button.btn.pri:hover{background:#E08E06}}
.row{display:flex;align-items:center;flex-wrap:wrap;margin:8px -4px}

.grid2{display:grid;grid-template-columns:1fr 1fr;grid-gap:0 16px}
.grid4{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;grid-gap:0 16px}
.w90{width:90px!important}.w140{width:140px!important}.w220{width:220px!important}.auto{width:auto!important;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{font-weight:600;color:var(--mut);font-size:13px;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
/* 작성 화면 */
.work{display:grid;grid-template-columns:320px 1fr;grid-gap:16px;align-items:start}
.work>*{min-width:0}
nav.tabs .tg{font-size:12px;color:var(--mut);align-self:center;margin:0 10px 2px 0}nav.tabs .tg~.tg{margin-left:12px}
.stgs{display:flex;flex-wrap:wrap;align-items:baseline;margin:4px 0 8px}
.sg{border:0;background:none;font:inherit;font-size:13px;color:var(--mut);padding:3px 0;margin:0 18px 2px 0;border-bottom:2px solid transparent;white-space:nowrap}button.sg{cursor:pointer}
.sg b{font-variant-numeric:tabular-nums;font-weight:700;margin-right:5px}.sg span{font-variant-numeric:tabular-nums;font-weight:400}
.sg.done{color:var(--text)}.sg.done b{color:var(--amber-d)}.sg.bad span{color:var(--err);font-weight:600}.sg.now{color:var(--text);font-weight:600;border-bottom-color:var(--amber)}
.lab .num{color:var(--amber-d)}
.seg{display:inline-flex}.seg .btn{border-radius:0}.seg .btn:first-child{border-radius:8px 0 0 8px}.seg .btn:last-child{border-radius:0 8px 8px 0;border-left:0}.seg .btn[aria-pressed=true]{background:var(--amber-l);border-color:var(--amber-l)}

.ev.used{color:var(--mut);background:var(--sub)}
.hl{position:relative}

.ov .e{border-bottom:2px dotted var(--amber-d)}.ov .n{border-bottom:2px solid var(--err)}.ov .z{outline:2px solid var(--err)}

.occ{max-height:32vh;overflow:auto;margin:8px 0}.occ label{display:flex;align-items:flex-start;font-weight:400;font-size:13px;line-height:1.7;margin:0;padding:2px 0}.occ input{width:auto;flex:none;margin:5px 8px 0 0}.occ span{min-width:0}.occ del{color:var(--mut)}.occ ins{text-decoration:none;font-weight:700;color:var(--amber-d)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;max-height:calc(100vh - 220px);overflow:auto}
.list table td,.list table th{padding:6px 6px}
.list thead th{position:sticky;top:0;background:var(--surface)}
.list tr.cur td{background:var(--sub)}

.list input{width:auto}
.st{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:1px 8px;white-space:nowrap;background:var(--sub);color:var(--text)}
.st.s1{background:var(--amber-l)}.st.s2{background:var(--amber)}.st.s3{background:var(--amber-d);color:#fff}
.st.sx{background:var(--surface);color:var(--err);border:1px solid var(--err)}
.who{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.field{margin-bottom:16px}
.picked{font-size:14px;background:var(--sub);border-radius:8px;padding:8px 12px;margin-top:6px;min-height:20px}
.box{background:var(--sub);border-radius:8px;padding:10px 12px;white-space:pre-wrap;min-height:44px}
.meter{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums;margin-left:auto}
.meter b{color:var(--text)}
.meter.over,.meter.over b{color:var(--err);font-weight:700}
.lab{display:flex;align-items:baseline;margin:16px 0 4px}
.lab label,.lab .lb{margin:0;font-weight:600;font-size:13px}
.lab .num{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;margin-right:8px}
.checks{list-style:none;margin:8px 0 0;padding:0;font-size:14px}
.checks li{padding:4px 0 4px 56px;position:relative;border-top:1px solid var(--line)}
.checks li:first-child{border-top:0}
.checks li i{position:absolute;left:0;top:4px;font-style:normal;font-weight:700;font-size:12px;width:48px}
.checks li.err i{color:var(--err)}.checks li.warn i{color:var(--amber-d)}.checks li.info i{color:var(--mut)}
.ainote{font-size:13px;border-left:0;background:var(--sub);border-radius:8px;padding:8px 12px;margin-top:6px;white-space:pre-wrap}
details.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
details.item>summary{cursor:pointer;padding:10px 12px;font-weight:600;list-style-position:inside}
details.item>div{padding:0 12px 12px}
.opt{display:grid;grid-template-columns:28px 1fr 1fr auto;grid-gap:8px;align-items:start;margin-top:8px}
.opt .lv{font-weight:700;font-variant-numeric:tabular-nums;padding-top:8px}
.optb{display:flex;flex-direction:column}.optb button{margin:0 0 4px}
.pill[disabled]{opacity:.45;cursor:not-allowed}
.where.warn{color:var(--err);font-weight:600}
.rev{font-size:14px;line-height:1.7;background:var(--sub);border-radius:8px;padding:8px 12px;margin-top:6px;white-space:pre-wrap}
.hit{font-size:13px;line-height:1.8;margin-top:6px}.hit del{color:var(--mut)}.hit ins{text-decoration:none;font-weight:700;color:var(--amber-d)}
.chk{display:inline-flex;align-items:center;font-weight:400;font-size:14px;margin:4px 16px 4px 0}.chk input{width:auto;margin:0 6px 0 0}
#modal input[type=file]{font:inherit;font-size:14px;max-width:100%}
/* 모달·상태 */
#modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(26,26,26,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
#modal[hidden]{display:none}
#modal .dlg{background:var(--surface);border-radius:14px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:20px 24px}
#modal h2{margin-top:0}
#modal pre{white-space:pre-wrap;word-break:break-all;background:var(--sub);border-radius:8px;padding:12px;font:13px/1.7 inherit;font-family:inherit;max-height:42vh;overflow:auto;margin:4px 0 12px}
#status{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1A1A1A;color:#fff;border-radius:8px;padding:8px 16px;font-size:14px;max-width:80vw;z-index:40;white-space:pre-wrap}
#status:empty{display:none}
#modal:not([hidden])~#status{bottom:auto;top:16px}
#status.err{background:var(--err)}
ol.steps{padding-left:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;padding-left:40px;position:relative;margin-bottom:8px}
ol.steps li:before{content:counter(s,decimal-leading-zero);position:absolute;left:0;font-weight:700;font-variant-numeric:tabular-nums;color:var(--amber-d)}
@media (max-width:900px){.work{grid-template-columns:1fr}.list{max-height:260px}.grid2,.grid4{grid-template-columns:1fr}.opt{grid-template-columns:28px 1fr}.opt>textarea,.opt>.optb{grid-column:2}.optb{flex-direction:row}.optb button{margin:0 4px 0 0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{a.back,header.top .pill,nav.tabs,.where,button,#status{display:none!important}body{background:#fff;color:#000}.card,.list{border:1px solid #ccc}}
</style>

<body>
<header class="top"><div class="wrap">
  <a class="back" href="../">← 바로가기 모음</a>
  <h1>생기부 문장 작업대</h1>
  <span class="pill" id="saveSt">불러오는 중</span>
  <button type="button" class="pill" id="undoB" data-a="undo" disabled>되돌리기</button>
  <button type="button" class="pill" id="redoB" data-a="redo" disabled>다시 하기</button>
  <span class="sp"></span>
  <button type="button" class="pill" id="aiSt" data-a="goAi">AI 미연결</button>
</div></header>
<nav class="tabs"><div class="wrap" role="tablist">
  <span class="tg">준비</span><button role="tab" data-tab="build"><b>01</b>시트 구성</button>
  <button role="tab" data-tab="ai"><b>02</b>AI 연결</button>
  <span class="tg">작성</span><button role="tab" data-tab="write"><b>03</b>작성</button>
  <span class="tg">관리</span><button role="tab" data-tab="save"><b>04</b>저장·내보내기</button>
  <button role="tab" data-tab="help">도움말</button>
</div></nav>
<div class="wrap">
  <p class="where">입력한 내용은 이 브라우저 안에만 저장됩니다. AI를 연결하고 초안·점독·요약을 요청할 때만, 그 학생의 글이 이름을 가린 채 Claude API로 전송됩니다. 과제물 PDF만은 이름을 가리지 못하며, 파일을 고를 때 다시 알려 드립니다. 연결하지 않아도 나머지 기능은 그대로 쓸 수 있습니다.</p>
  <p class="where warn" id="tabWarn" hidden>다른 탭에도 이 도구가 열려 있습니다. 두 탭에서 고치면 나중에 저장한 쪽만 남으니 한 탭은 닫아 주세요.</p>
  <main id="main"></main>
</div>
<div id="modal" hidden><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="mT"><h2 id="mT"></h2><div id="mB"></div><div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="mNo">취소</button><button type="button" class="btn pri" id="mOk">확인</button></div></div></div>
<div id="status" role="status" aria-live="polite"></div>

<script>
'use strict';
/* 생기부 문장 작업대 (2차: 되돌리기·백업, 찾아 바꾸기, AI 점독, 과제물 요약)
 * 미리 써 둔 공통 문구와 학생별 관찰 메모를 이어 붙이고, 바이트와 문장 규칙을 살핀 뒤, 원하면 AI 초안을 받아 최종 문장을 다듬는다.
 * 자료는 이 브라우저(IndexedDB)에만 둔다. API 키는 이 탭(sessionStorage)에만 둔다. 외부 스크립트·글꼴을 쓰지 않는다. */
const $ = (q, r) => (r || document).querySelector(q), $$ = (q, r) => Array.from((r || document).querySelectorAll(q));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 7);
const KINDS = {
  seteuk: { label: '교과 세특', limit: 1500, lo: 1400 },
  jayul: { label: '자율활동', limit: 1500, lo: 1450 },
  dongari: { label: '동아리활동', limit: 1500, lo: 1450 },
  jinro: { label: '진로활동', limit: 1500, lo: 1450 },
  haeng: { label: '행동특성 및 종합의견', limit: 900, lo: 0 }
};
const kindLabel = sh => (sh.kind === 'jayul' && sh.gen === '2022' ? '자율·자치활동' : KINDS[sh.kind].label);
const blank = () => ({ v: 1, sheets: [], cur: '', ai: { model: 'claude-sonnet-5-5', effort: 'medium', delay: 1, extra: '' }, nl: 2, ban: '', words: '' });
let S = blank();
const U = { tab: 'build', view: 'one', row: '', filter: 'all', sel: new Set(), key: '', models: null, busy: false, ctl: null, storage: true };

/* ───────── 저장 ───────── */
const DB = 'saenggibu-workbench';
function idb(mode, fn) {
  return new Promise((res, rej) => {
    let rq; try { rq = indexedDB.open(DB, 1); } catch (e) { return rej(e); }
    rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
    rq.onerror = () => rej(rq.error);
    rq.onsuccess = () => { const db = rq.result, tx = db.transaction('kv', mode); let out; fn(tx.objectStore('kv'), v => { out = v; }); tx.oncomplete = () => { db.close(); res(out); }; tx.onerror = tx.onabort = () => { db.close(); rej(tx.error); }; };
  });
}
let saveT = null;
/* 되돌리기: 고치기 직전의 모습을 차곡차곡 둔다. key가 같은 고침이 4초 안에 이어지면(글자 입력) 한 번으로 묶되 20초를 넘기지 않고, '#'로 시작하는 key(AI 여러 명 요청)는 사이에 다른 고침이 없으면 끝날 때까지 한 번으로 묶는다 */
const snapS = () => JSON.stringify(Object.assign({}, S, { cur: '' })); // 어느 시트를 보고 있는지는 되돌리기 단계로 세지 않는다
let lastSnap = snapS(), UN = [], RE = [], lastKey = '', lastT = 0, burstT = 0, bkLast = 0;
function paintUndo() {
  const u = $('#undoB'), r = $('#redoB'), tip = (st, w, none) => (st.length ? w + (st[st.length - 1].label ? ': ' + st[st.length - 1].label : '') : none);
  u.disabled = !UN.length; r.disabled = !RE.length; u.title = tip(UN, '되돌리기', '되돌릴 것이 없습니다'); r.title = tip(RE, '다시 하기', '다시 할 것이 없습니다');
}
function persist() { clearTimeout(saveT); saveT = setTimeout(saveNow, 300); $('#saveSt').textContent = '저장 중'; }
function save(key, label) {
  const now = Date.now(), snap = snapS();
  if (snap !== lastSnap) {
    const same = key && key === lastKey && (key.charAt(0) === '#' || (now - lastT < 4000 && now - burstT < 20000));
    if (!same) { burstT = now; UN.push({ snap: lastSnap, label: label || '고침' }); let sum = 0; UN.forEach(e => { sum += e.snap.length; }); while (UN.length > 40 || (sum > 3e7 && UN.length > 1)) sum -= UN.shift().snap.length; }
    if (bkLast && now - bkLast > 600000) backup('10분마다', lastSnap); // 고치기 직전의 모습을 남긴다
    RE = []; lastKey = key || ''; lastT = now; lastSnap = snap; paintUndo();
  }
  persist();
}
function undo(redo) {
  const from = redo ? RE : UN, to = redo ? UN : RE, e = from.pop(); if (!e) return;
  to.push({ snap: lastSnap, label: e.label });

function renderHelp() {

document.addEventListener('change', async e => {

    if (v) r2.v[it.id] = v; else delete r2.v[it.id]; save('', '공통 문구 고르기'); paintRowDyn(sh, r2); sumLater();

  else if (d.it && d.if === 'type' && sh) { const it = sh.items.find(x => x.id === d.it), used = sh.rows.filter(r => r.v[it.id]).length; if (U.busy) { t.value = it.type; return say('오류: AI 요청이 끝난 뒤에 해 주세요.', true); } if (used && !(await ask('칸 종류를 바꿀까요?', [used + '명이 이 칸에 넣은 내용이 지워집니다.'], '바꾸기'))) { t.value = it.type; return; } it.type = t.value; if (it.type === 'pick' && !it.opts.length) it.opts = [{ id: uid('o'), text: '', alts: [] }]; if (used) backup('칸 종류 바꾸기 전'); sh.rows.forEach(r => { delete r.v[it.id]; }); U.openItem = it.id; save('', '칸 종류 바꾸기'); render(); }
  else if (d.ai && t.tagName === 'SELECT') { S.ai[d.ai] = t.value; save('', 'AI 설정'); }

document.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('details.item[data-it]') && e.target.open) U.openItem = e.target.dataset.it; }, true);
document.addEventListener('keydown', e => { // 칸 안에서는 브라우저의 되돌리기(그 칸의 글자)를 그대로 두고, 칸 밖에서만 도구의 되돌리기를 쓴다

  const k = e.code === 'KeyZ' ? 'z' : e.code === 'KeyY' ? 'y' : e.key.toLowerCase(); if (k !== 'z' && k !== 'y') return; // 한글 자판에서도 듣게 자리(code)로 본다
  e.preventDefault(); if (U.busy) return say('오류: AI 요청이 끝난 뒤에 해 주세요.', true); undo(k === 'y' || e.shiftKey);
});
document.addEventListener('keydown', e => { // 세특 검증 편집기에서 쓰던 글쇠. 한글 자판에서도 듣게 자리(code)로 본다
  if (!(e.ctrlKey || e.metaKey) || e.altKey || !$('#modal').hidden) return;

  else if (e.code === 'KeyF' && U.tab === 'write' && sheet()) { e.preventDefault(); if (U.busy) return say('오류: AI 요청이 끝난 뒤에 해 주세요.', true); replaceAll(); }
  else if (U.tab === 'write' && (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Enter')) {

      const el = document.activeElement, d = el && el.dataset; if (!d || !(d.tp || d.tt)) return;

    setTimeout(() => { setRow(nx.id); const f = id && document.getElementById(id); if (f && f.focus) f.focus(); }, 30);
  }
});

document.addEventListener('keydown', e => { if (e.altKey && (e.key === 'ArrowDown' || e.key === 'ArrowUp') && U.tab === 'write' && U.view !== 'all') { const sh = sheet(), row = rowOf(sh); if (!row) return; const r = sh.rows[sh.rows.indexOf(row) + (e.key === 'ArrowDown' ? 1 : -1)]; if (r) { e.preventDefault(); setRow(r.id); } } });
