<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>색감 노트 — 디자이너 색 레퍼런스</title>
<style>
  :root {
    --bg: #F4F5F7;
    --card: #FFFFFF;
    --ink: #171A20;
    --ink-soft: #5A616C;
    --line: #E3E5EA;
    --accent: #3355D8;
    --accent-strong: #2543B8;
    --accent-soft: #EBF0FF;
    --danger: #D6336C;
    --shadow: 0 1px 2px rgba(23,26,32,.05), 0 4px 14px rgba(23,26,32,.06);
    --shadow-lift: 0 2px 6px rgba(23,26,32,.07), 0 12px 28px rgba(23,26,32,.11);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161B; --card: #1D2027; --ink: #EAECF1; --ink-soft: #9BA2AE;
      --line: #2D313B; --accent: #8298FF; --accent-strong: #A5B4FF;
      --accent-soft: #242C4E; --danger: #FF8CB0;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
      --shadow-lift: 0 2px 6px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161B; --card: #1D2027; --ink: #EAECF1; --ink-soft: #9BA2AE;
    --line: #2D313B; --accent: #8298FF; --accent-strong: #A5B4FF;
    --accent-soft: #242C4E; --danger: #FF8CB0;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    --shadow-lift: 0 2px 6px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition: none !important; animation: none !important; }
  }
  body {
    font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 1020px; margin: 0 auto; }

  :is(button, a, input):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { font-family: inherit; cursor: pointer; }

  header {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 12px; margin-bottom: 18px;
  }
  h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
  h1 .emoji { margin-right: 8px; }
  .subtitle { margin-top: 5px; font-size: 0.84rem; color: var(--ink-soft); line-height: 1.55; }
  .icon-btn {
    flex: 0 0 auto; width: 42px; height: 42px; font-size: 1.05rem;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow);
  }
  .icon-btn:hover { background: var(--accent-soft); }

  .search-row { margin-bottom: 12px; }
  .search-row input {
    width: 100%; padding: 12px 16px; font-size: 0.95rem; font-family: inherit;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--card); color: var(--ink);
    box-shadow: var(--shadow); outline: none;
  }
  .search-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }

  .tabs {
    display: flex; gap: 8px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 10;
    padding: 10px 0 12px; margin-bottom: 8px;
    background: var(--bg);
  }
  .tab {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 15px; border-radius: 999px;
    background: var(--card); color: var(--ink-soft);
    border: 1px solid var(--line); font-size: 0.86rem; font-weight: 600;
  }
  .tab .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .tab.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .tab:not(.active):hover { background: var(--accent-soft); }

  .section { margin-bottom: 30px; }
  .section-head { margin: 20px 4px 4px; display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .section-head .dot { width: 12px; height: 12px; border-radius: 50%; align-self: center; flex: 0 0 auto; }
  .section-head h2 { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.015em; }
  .section-head .feel { font-size: 0.84rem; color: var(--ink-soft); font-weight: 600; }
  .section-tip { margin: 2px 4px 12px 25px; font-size: 0.8rem; color: var(--ink-soft); line-height: 1.55; }

  .grid {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }
  .ccard {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform .12s, border-color .12s, box-shadow .12s;
  }
  .ccard:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: var(--shadow-lift); }
  .swatch {
    display: block; width: 100%; height: 92px; border: 0; padding: 8px 10px;
    text-align: right; vertical-align: bottom;
    display: flex; align-items: flex-end; justify-content: flex-end;
    font-size: 0.76rem; font-weight: 700; letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    opacity: 1; transition: filter .12s;
  }
  .swatch:hover { filter: brightness(0.96); }
  .swatch .hexlabel { opacity: .0; transition: opacity .12s; }
  .ccard:hover .hexlabel, .swatch:focus-visible .hexlabel { opacity: .95; }
  .cbody { padding: 11px 13px 12px; }
  .cname { font-size: 0.94rem; font-weight: 700; letter-spacing: -0.015em; }
  .cname .en { font-size: 0.74rem; font-weight: 600; color: var(--ink-soft); margin-left: 6px; }
  .cfeel { margin-top: 3px; font-size: 0.8rem; color: var(--ink-soft); line-height: 1.5; min-height: 2.4em; }
  .codes { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    font-size: 0.72rem; font-weight: 600; font-variant-numeric: tabular-nums;
    padding: 4px 8px; border-radius: 7px;
  }
  .chip:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .chip b { font-weight: 700; opacity: .55; margin-right: 3px; font-size: 0.66rem; }
  .tags { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 4px; }
  .tag {
    font-size: 0.68rem; font-weight: 600; color: var(--ink-soft);
    background: var(--bg); border-radius: 999px; padding: 2px 8px;
  }

  /* 추천 조합 */
  .pal {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 12px;
  }
  .pal-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .pal-head h3 { font-size: 0.95rem; font-weight: 700; letter-spacing: -0.015em; }
  .pal-head .use { font-size: 0.78rem; color: var(--ink-soft); }
  .pal-head .copy-all {
    margin-left: auto; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    font-size: 0.76rem; font-weight: 600; padding: 6px 11px; border-radius: 8px;
  }
  .pal-head .copy-all:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .pal-strip { display: flex; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  .pal-strip button {
    flex: 1; height: 58px; border: 0; position: relative;
    font-size: 0.68rem; font-weight: 700; font-variant-numeric: tabular-nums;
    display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px;
  }
  .pal-strip button span { opacity: 0; transition: opacity .12s; }
  .pal-strip button:hover span, .pal-strip button:focus-visible span { opacity: .95; }

  .empty { text-align: center; color: var(--ink-soft); padding: 48px 0; font-size: 0.92rem; }

  footer {
    margin-top: 40px; font-size: 0.78rem; color: var(--ink-soft); line-height: 1.8;
    border-top: 1px solid var(--line); padding-top: 16px;
  }
  footer b { color: var(--ink); }

  #toast {
    position: fixed; left: 50%; bottom: 28px;
    transform: translateX(-50%) translateY(10px);
    background: var(--ink); color: var(--bg);
    font-size: 0.82rem; font-weight: 600;
    padding: 10px 18px; border-radius: 999px;
    box-shadow: var(--shadow-lift);
    opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 100; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 560px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .cfeel { min-height: auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><span class="emoji">🎨</span>색감 노트</h1>
      <p class="subtitle">디자이너가 즐겨 쓰는 색을 계열별로 정리했습니다. 색마다 다른 <b>느낌</b>과 HEX·RGB·HSL 코드를 함께 — 누르면 복사됩니다.</p>
    </div>
    <button class="icon-btn" id="themeBtn" title="테마 전환 (자동 → 라이트 → 다크)" aria-label="테마 전환">🌗</button>
  </header>

  <div class="search-row">
    <input type="search" id="searchInput" placeholder="🔍 색 이름, 코드, 느낌으로 검색… (예: 세련, 네이비, #FF)">
  </div>

  <nav class="tabs" id="tabs" aria-label="색 계열"></nav>

  <main id="content"></main>

  <footer>
    <b>색 고르는 3가지 요령</b><br>
    ① 주인공 색은 하나만 — 넓은 면적은 낮은 채도로 깔고, 선명한 색은 강조할 한 곳에만 씁니다.<br>
    ② 글자는 명도 차이가 생명 — 밝은 배경엔 잉크·차콜처럼 충분히 어두운 색을 쓰세요. 노랑·파스텔은 글자색으로 쓰지 않습니다.<br>
    ③ 순수 #000000·#FFFFFF보다 잉크(#171A20)·오프화이트(#FAF9F6)처럼 살짝 물든 톤이 한층 편안하고 세련되어 보입니다.
  </footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>

/* ---------- 색 계산 ---------- */
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h = 0, s = 0;
  const l = (max + min) / 2;
  if (max !== min) {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
    else if (max === g) h = ((b - r) / d + 2) / 6;
    else h = ((r - g) / d + 4) / 6;
  }
  return [Math.round(h * 360), Math.round(s * 100), Math.round(l * 100)];
}
/* 어두운 색 위에는 밝은 글자, 밝은 색 위에는 어두운 글자 */
function labelColor(hex) {
  const [r, g, b] = hexToRgb(hex);
  const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  return lum > 150 ? "rgba(23,26,32,.82)" : "rgba(255,255,255,.94)";
}

/* ---------- 복사 & 토스트 ---------- */
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}
function copyText(text, label) {
  const done = () => toast((label || text) + " 복사됨");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); done(); } catch (e) { toast("복사에 실패했습니다"); }
  document.body.removeChild(ta);
}

/* ---------- 렌더링 ---------- */
let currentFamily = "all";

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  const defs = [{ id: "all", name: "전체", rep: null }, ...FAMILIES, { id: "pal", name: "추천 조합", rep: null }];
  defs.forEach(d => {
    const b = document.createElement("button");
    b.className = "tab" + (currentFamily === d.id ? " active" : "");
    if (d.rep) {
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = d.rep;
      b.appendChild(dot);
    }
    b.appendChild(document.createTextNode(d.name));
    b.onclick = () => { currentFamily = d.id; render(); };
    tabs.appendChild(b);
  });
}

function matches(c, q) {
  if (!q) return true;
  const hay = (c.ko + " " + c.en + " " + c.hex + " " + c.feel + " " + c.tags.join(" ")).toLowerCase();
  return hay.includes(q);
}

function makeColorCard(c) {
  const card = document.createElement("div");
  card.className = "ccard";

  const sw = document.createElement("button");
  sw.className = "swatch";
  sw.style.background = c.hex;
  sw.style.color = labelColor(c.hex);
  sw.setAttribute("aria-label", c.ko + " " + c.hex + " 복사");
  const hl = document.createElement("span");
  hl.className = "hexlabel";
  hl.textContent = c.hex;
  sw.appendChild(hl);
  sw.onclick = () => copyText(c.hex);

  const body = document.createElement("div");
  body.className = "cbody";

  const name = document.createElement("div");
  name.className = "cname";
  name.textContent = c.ko;
  const en = document.createElement("span");
  en.className = "en";
  en.textContent = c.en;
  name.appendChild(en);

  const feel = document.createElement("div");
  feel.className = "cfeel";
  feel.textContent = c.feel;

  const [r, g, b] = hexToRgb(c.hex);
  const [h, s, l] = rgbToHsl(r, g, b);
  const codes = document.createElement("div");
  codes.className = "codes";
  [
    { label: "HEX", text: c.hex,                          copy: c.hex },
    { label: "RGB", text: r + " " + g + " " + b,          copy: "rgb(" + r + ", " + g + ", " + b + ")" },
    { label: "HSL", text: h + "° " + s + "% " + l + "%", copy: "hsl(" + h + ", " + s + "%, " + l + "%)" }
  ].forEach(k => {
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.title = k.copy + " 복사";
    const bb = document.createElement("b");
    bb.textContent = k.label;
    chip.appendChild(bb);
    chip.appendChild(document.createTextNode(k.text));
    chip.onclick = () => copyText(k.copy);
    codes.appendChild(chip);
  });

  const tags = document.createElement("div");
  tags.className = "tags";
  c.tags.forEach(t => {
    const tg = document.createElement("span");
    tg.className = "tag";
    tg.textContent = "#" + t;
    tags.appendChild(tg);
  });

  body.appendChild(name);
  body.appendChild(feel);
  body.appendChild(codes);
  body.appendChild(tags);
  card.appendChild(sw);
  card.appendChild(body);
  return card;
}

function makePalette(p) {
  const pal = document.createElement("div");
  pal.className = "pal";

  const head = document.createElement("div");
  head.className = "pal-head";
  const h3 = document.createElement("h3");
  h3.textContent = p.name;
  const use = document.createElement("span");
  use.className = "use";
  use.textContent = p.use;
  const copyAll = document.createElement("button");
  copyAll.className = "copy-all";
  copyAll.textContent = "전체 복사";
  copyAll.onclick = () => copyText(p.colors.join(", "), p.name + " 팔레트");
  head.appendChild(h3); head.appendChild(use); head.appendChild(copyAll);

  const strip = document.createElement("div");
  strip.className = "pal-strip";
  p.colors.forEach(hex => {
    const b = document.createElement("button");
    b.style.background = hex;
    b.style.color = labelColor(hex);
    b.setAttribute("aria-label", hex + " 복사");
    const sp = document.createElement("span");
    sp.textContent = hex;
    b.appendChild(sp);
    b.onclick = () => copyText(hex);
    strip.appendChild(b);
  });

  pal.appendChild(head);
  pal.appendChild(strip);
  return pal;
}

function render() {
  renderTabs();
  const content = document.getElementById("content");
  content.innerHTML = "";
  const q = document.getElementById("searchInput").value.trim().toLowerCase();

  let any = false;

  if (currentFamily !== "pal") {
    const fams = currentFamily === "all" ? FAMILIES : FAMILIES.filter(f => f.id === currentFamily);
    fams.forEach(f => {
      const list = f.colors.filter(c => matches(c, q));
      if (!list.length) return;
      any = true;

      const sec = document.createElement("section");
      sec.className = "section";

      const head = document.createElement("div");
      head.className = "section-head";
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = f.rep;
      const h2 = document.createElement("h2");
      h2.textContent = f.name;
      const feel = document.createElement("span");
      feel.className = "feel";
      feel.textContent = f.feel;
      head.appendChild(dot); head.appendChild(h2); head.appendChild(feel);

      const tip = document.createElement("p");
      tip.className = "section-tip";
      tip.textContent = f.tip;

      const grid = document.createElement("div");
      grid.className = "grid";
      list.forEach(c => grid.appendChild(makeColorCard(c)));

      sec.appendChild(head);
      sec.appendChild(tip);
      sec.appendChild(grid);
      content.appendChild(sec);
    });
  }

  if (currentFamily === "all" || currentFamily === "pal") {
    const pals = PALETTES.filter(p => !q || (p.name + " " + p.use + " " + p.colors.join(" ")).toLowerCase().includes(q));
    if (pals.length) {
      any = true;
      const sec = document.createElement("section");
      sec.className = "section";
      const head = document.createElement("div");
      head.className = "section-head";
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = "linear-gradient(135deg, #E03131, #F4C430, #2F9E44, #3355D8)";
      const h2 = document.createElement("h2");
      h2.textContent = "추천 조합";
      const feel = document.createElement("span");
      feel.className = "feel";
      feel.textContent = "목적에 맞게 고른 5색 팔레트";
      head.appendChild(dot); head.appendChild(h2); head.appendChild(feel);
      const tip = document.createElement("p");
      tip.className = "section-tip";
      tip.textContent = "왼쪽부터 주조색 → 보조색 → 바탕색 순서로 배치했습니다. 「전체 복사」를 누르면 다섯 코드를 한 번에 가져갈 수 있어요.";
      sec.appendChild(head);
      sec.appendChild(tip);
      pals.forEach(p => sec.appendChild(makePalette(p)));
      content.appendChild(sec);
    }
  }

  if (!any) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "검색 결과가 없습니다.";
    content.appendChild(e);
  }
}

/* ---------- 테마 (자동 → 라이트 → 다크 순환) ---------- */
const THEME_KEY = "colornote-theme";
const THEME_ORDER = ["auto", "light", "dark"];
const THEME_LABEL = { auto: "🌗", light: "☀️", dark: "🌙" };
const THEME_NAME  = { auto: "자동", light: "라이트", dark: "다크" };
function applyTheme(mode) {
  if (mode === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", mode);
  const btn = document.getElementById("themeBtn");
  btn.textContent = THEME_LABEL[mode];
  btn.title = "테마: " + THEME_NAME[mode] + " (누르면 전환)";
}
let theme = localStorage.getItem(THEME_KEY);
if (!THEME_ORDER.includes(theme)) theme = "auto";
applyTheme(theme);
document.getElementById("themeBtn").onclick = () => {
  theme = THEME_ORDER[(THEME_ORDER.indexOf(theme) + 1) % THEME_ORDER.length];
  localStorage.setItem(THEME_KEY, theme);
  applyTheme(theme);
};

/* ---------- 이벤트 ---------- */
document.getElementById("searchInput").oninput = render;
document.addEventListener("keydown", e => {
  if (e.key === "/" && !/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) {
    e.preventDefault();
    document.getElementById("searchInput").focus();
  }
});

render();
